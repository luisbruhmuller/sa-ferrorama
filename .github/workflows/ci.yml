name: Verificação

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-local-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-local-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      FERRORAMA_DB_HOST: 127.0.0.1
      FERRORAMA_DB_USER: root
      FERRORAMA_DB_PASSWORD: test-local-only
      FERRORAMA_DB_PORT: 3306
      FERRORAMA_TEST_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PHP e cliente MySQL
        run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql php-mbstring mysql-client
      - name: Conferir sintaxe PHP
        run: find infra public tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Preparar banco
        run: mysql --host=127.0.0.1 --user=root --password="$FERRORAMA_DB_PASSWORD" < database/db.sql
      - name: Iniciar aplicação
        run: php -S 127.0.0.1:8000 -t . > /tmp/ferrorama-php.log 2>&1 &
      - name: Aguardar servidor
        run: for i in {1..20}; do curl -fsS http://127.0.0.1:8000/public/tela_landing/tela_landing.php >/dev/null && exit 0; sleep 1; done; cat /tmp/ferrorama-php.log; exit 1
      - name: Testar APIs e fluxos HTTP
        run: node --test tests/*.test.js
